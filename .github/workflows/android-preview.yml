name: Android test app

# Builds an installable Android test app and posts it under Releases
# so it can be downloaded straight onto a phone.

on:
  push:
    branches: [app-foundation, main]
    paths-ignore: ['**.md', 'firestore.rules']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Check the code
        run: npx tsc --noEmit
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the app
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Post it under Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk sca-alumni-test.apk
          gh release delete android-test --yes --cleanup-tag || true
          gh release create android-test sca-alumni-test.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "SCA Alumni: Android test app" \
            --notes "Test build from $GITHUB_SHA. Download the .apk on an Android phone and open it to install. Not for the public."
